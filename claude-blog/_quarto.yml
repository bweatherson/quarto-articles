# claude-blog/ is its own Quarto project, so that its output goes to
# claude-blog/_claude-site rather than the main site's _site. The main
# _quarto.yml excludes this folder from its render list.
#
# Options below were moved from claude-blog/_metadata.yml (Quarto ignores a
# _metadata.yml at the top of a project). Paths here are relative to this
# folder, so the old "../../" became "../". Nothing here is linked from any
# public page; the folder is in-house until decided otherwise.

project:
  type: default
  output-dir: _claude-site

freeze: true
title-block-banner: true

bibliography: ../brian-quarto.bib
csl: ../chicago-with-note.csl

format:
    docx:
      reference-doc: ../quarto-articles-template.docx
      toc: false
      number-sections: true
    html:
      toc: true
      toc-depth: 3
      fontsize: 1.25em
      toc-location: left
      toc-title: "Sections"
      reference-location: margin
      appendix-cite-as: bibtex
      pagetitle: "{{< meta title >}}"
    pdf:
      classoption: twoside
      geometry: "left=1.1in,
                 right=1in,
                 top=0.8in,
                 bottom=0.8in,
                 paperheight=9.5in,
                 paperwidth=7in,
                 includemp=TRUE,
                 marginparwidth=0in,
                 marginparsep=0in"
      mathspec: false
      mathfont: Garamond-Math
      fontsize: 11pt
      indent: true
      linkcolor: black
      urlcolor: black
      colorlinks: false
      linestretch: 1.1
      link-citations: true
      keep-tex: true
      pdf-engine: xelatex
      include-in-header:
        file: quarto2024.tex
      date-format: "YYYY"
number-sections: true
number-depth: 3
